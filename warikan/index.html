<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>割り勘計算 - 高機能版</title>
</head>
<body>
<div class="container">
  <header>
    <h1>💰 割り勘計算</h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="テーマ切替">🌙</button>
  </header>

  <div class="card">
    <h2>金額入力</h2>
    <div class="field">
      <label>合計金額（円）</label>
      <input type="number" id="totalAmount" placeholder="10000" min="0" step="1">
    </div>
    <div class="row">
      <div class="field">
        <label>税率（%）</label>
        <select id="taxRate">
          <option value="0">なし（税込）</option>
          <option value="8">8%</option>
          <option value="10" selected>10%</option>
        </select>
      </div>
      <div class="field">
        <label>サービス料（%）</label>
        <input type="number" id="serviceRate" value="0" min="0" step="0.1">
      </div>
    </div>
    <div class="split-info" id="subtotalInfo"></div>
  </div>

  <div class="card">
    <h2>メンバー</h2>
    <div id="memberList"></div>
    <button class="btn-add" onclick="addMember()">＋ メンバー追加</button>
  </div>

  <div class="card">
    <h2>分割方法</h2>
    <div class="tabs">
      <button class="active" data-mode="equal" onclick="setMode('equal')">均等割り</button>
      <button data-mode="weight" onclick="setMode('weight')">傾斜配分</button>
      <button data-mode="custom" onclick="setMode('custom')">個別入力</button>
    </div>
    <div class="field">
      <label>端数処理</label>
      <select id="roundMode">
        <option value="roundUp">切り上げ（多めに集める）</option>
        <option value="roundDown" selected>切り捨て</option>
        <option value="round">四捨五入</option>
      </select>
      <div class="hint">※均等割り時の1人あたりの端数処理に適用されます</div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="calculate()">計算する</button>

  <div class="card hidden" id="resultCard">
    <h2>計算結果</h2>
    <div class="result-total" id="resultTotal"></div>
    <ul class="result-list" id="resultList"></ul>
    <button class="btn btn-secondary" onclick="copyResult()">📋 結果をコピー</button>
    <div class="copy-msg hidden" id="copyMsg">コピーしました！</div>
  </div>

  <div class="card">
    <h2>履歴</h2>
    <div id="historyList"></div>
    <button class="btn btn-secondary" onclick="clearHistory()">履歴をクリア</button>
  </div>
</div>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1a202c; --sub: #718096;
    --primary: #3182ce; --primary-hover: #2b6cb0; --border: #e2e8f0;
    --danger: #e53e3e; --success: #38a169; --accent: #edf2f7;
  }
  [data-theme="dark"] {
    --bg: #1a202c; --card: #2d3748; --text: #f7fafc; --sub: #a0aec0;
    --primary: #63b3ed; --primary-hover: #4299e1; --border: #4a5568; --accent: #4a5568;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 16px;
    transition: background .2s, color .2s;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .theme-toggle {
    background: var(--card); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 1.1rem;
  }
  .card {
    background: var(--card); border-radius: 12px; padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .card h2 { font-size: 1rem; margin-bottom: 14px; color: var(--sub); font-weight: 600; }
  label { display: block; font-size: .875rem; color: var(--sub); margin-bottom: 6px; }
  input[type="number"], input[type="text"], select {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); transition: border-color .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: var(--accent); padding: 4px; border-radius: 10px;
  }
  .tabs button {
    flex: 1; padding: 8px; border: none; background: transparent;
    color: var(--sub); font-size: .875rem; font-weight: 600;
    border-radius: 6px; cursor: pointer; transition: all .15s;
  }
  .tabs button.active { background: var(--card); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .member-row {
    display: grid; grid-template-columns: 1fr 100px 100px 36px;
    gap: 8px; margin-bottom: 8px; align-items: center;
  }
  .member-row input { padding: 8px 10px; font-size: .9rem; }
  .btn-remove {
    background: var(--danger); color: white; border: none;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    font-size: 1.1rem; line-height: 1;
  }
  .btn {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; transition: all .15s;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--accent); color: var(--text); margin-top: 8px; }
  .btn-add {
    background: var(--accent); color: var(--primary);
    padding: 10px; width: 100%; border: 1px dashed var(--primary);
    border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 8px;
  }
  .result-total {
    font-size: 2rem; font-weight: 800; color: var(--primary);
    text-align: center; margin: 8px 0;
  }
  .result-total small { font-size: 1rem; color: var(--sub); font-weight: 500; }
  .result-list { list-style: none; }
  .result-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-radius: 8px; margin-bottom: 6px; background: var(--accent);
  }
  .result-list .name { font-weight: 600; }
  .result-list .amount { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
  .result-list .amount small { font-size: .75rem; color: var(--sub); font-weight: 400; margin-left: 4px; }
  .history-item {
    padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; font-size: .875rem;
  }
  .history-item .h-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .history-item .h-total { font-weight: 700; color: var(--primary); }
  .history-item .h-date { color: var(--sub); font-size: .75rem; }
  .history-item .h-members { color: var(--sub); font-size: .8rem; }
  .hint { font-size: .8rem; color: var(--sub); margin-top: 4px; }
  .hidden { display: none; }
  .copy-msg { text-align: center; color: var(--success); font-size: .875rem; margin-top: 8px; }
  .split-info { font-size: .8rem; color: var(--sub); margin-top: 6px; text-align: center; }
  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr; }
    .member-row { grid-template-columns: 1fr 80px 80px 36px; }
  }
</style>
<script>
let members = [];
let mode = 'equal';

function init() {
  const savedTheme = localStorage.getItem('warikan_theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  const savedMembers = localStorage.getItem('warikan_members');
  if (savedMembers) { try { members = JSON.parse(savedMembers); } catch(e) { members = []; } }
  if (!members.length) {
    members = [
      { name: 'Aさん', weight: 1, custom: 0 },
      { name: 'Bさん', weight: 1, custom: 0 },
      { name: 'Cさん', weight: 1, custom: 0 }
    ];
  }
  renderMembers();
  renderHistory();
  updateModeUI();
  updateSubtotalInfo();
  document.getElementById('totalAmount').addEventListener('input', updateSubtotalInfo);
  document.getElementById('taxRate').addEventListener('change', updateSubtotalInfo);
  document.getElementById('serviceRate').addEventListener('input', updateSubtotalInfo);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('warikan_theme', next);
}

function renderMembers() {
  const el = document.getElementById('memberList');
  el.innerHTML = '';
  members.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML =
      '<input type="text" value="' + escapeHtml(m.name) + '" placeholder="名前" oninput="updateMember(' + i + ', \'name\', this.value)">' +
      '<input type="number" value="' + (m.weight || 1) + '" min="0.1" step="0.1" oninput="updateMember(' + i + ', \'weight\', parseFloat(this.value) || 1)" class="weight-input" title="傾斜配分の重み">' +
      '<input type="number" value="' + (m.custom || 0) + '" min="0" step="1" oninput="updateMember(' + i + ', \'custom\', parseInt(this.value) || 0)" class="custom-input" title="個別金額">' +
      '<button class="btn-remove" onclick="removeMember(' + i + ')" title="削除">×</button>';
    el.appendChild(row);
  });
  updateModeUI();
  saveMembers();
}

function updateMember(i, key, val) { members[i][key] = val; saveMembers(); }
function addMember() { members.push({ name: 'メンバー' + (members.length + 1), weight: 1, custom: 0 }); renderMembers(); }
function removeMember(i) {
  if (members.length <= 1) { alert('メンバーは最低1人必要です'); return; }
  members.splice(i, 1); renderMembers();
}
function saveMembers() { localStorage.setItem('warikan_members', JSON.stringify(members)); }

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.toggle('active', b.dataset.mode === m); });
  updateModeUI();
}
function updateModeUI() {
  document.querySelectorAll('.weight-input').forEach(function(el) { el.style.display = mode === 'weight' ? '' : 'none'; });
  document.querySelectorAll('.custom-input').forEach(function(el) { el.style.display = mode === 'custom' ? '' : 'none'; });
  document.querySelectorAll('.member-row').forEach(function(row) {
    row.style.gridTemplateColumns = mode === 'equal' ? '1fr 36px' : '1fr 100px 100px 36px';
  });
}

function getBaseAmount() { return parseFloat(document.getElementById('totalAmount').value) || 0; }
function getFinalTotal() {
  const base = getBaseAmount();
  const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
  const svcRate = parseFloat(document.getElementById('serviceRate').value) || 0;
  const svc = base * (svcRate / 100);
  const subtotal = base + svc;
  const tax = subtotal * (taxRate / 100);
  return Math.round(subtotal + tax);
}
function updateSubtotalInfo() {
  const base = getBaseAmount();
  const final = getFinalTotal();
  const info = document.getElementById('subtotalInfo');
  if (!base) { info.textContent = ''; return; }
  info.textContent = final !== base ? '税・サービス料込合計：¥' + final.toLocaleString() : '合計：¥' + final.toLocaleString();
}

function calculate() {
  const total = getFinalTotal();
  if (total <= 0) { alert('合計金額を入力してください'); return; }
  if (members.length === 0) { alert('メンバーを追加してください'); return; }
  let results = [];

  if (mode === 'equal') {
    const n = members.length;
    const roundMode = document.getElementById('roundMode').value;
    let per;
    if (roundMode === 'roundUp') per = Math.ceil(total / n);
    else if (roundMode === 'roundDown') per = Math.floor(total / n);
    else per = Math.round(total / n);
    const diff = total - per * n;
    results = members.map(function(m, i) { return { name: m.name, amount: per + (i === n - 1 ? diff : 0) }; });
  } else if (mode === 'weight') {
    const totalWeight = members.reduce(function(s, m) { return s + (m.weight || 1); }, 0);
    let allocated = 0;
    results = members.map(function(m, i) {
      let amt;
      if (i === members.length - 1) amt = total - allocated;
      else { amt = Math.floor(total * (m.weight || 1) / totalWeight); allocated += amt; }
      return { name: m.name, amount: amt, weight: m.weight };
    });
  } else if (mode === 'custom') {
    const sum = members.reduce(function(s, m) { return s + (m.custom || 0); }, 0);
    if (sum !== total) {
      const ok = confirm('個別金額の合計（¥' + sum.toLocaleString() + '）が合計金額（¥' + total.toLocaleString() + '）と一致しません。\n差額を最後のメンバーで調整しますか？');
      if (!ok) return;
      const diff = total - sum;
      results = members.map(function(m, i) { return { name: m.name, amount: (m.custom || 0) + (i === members.length - 1 ? diff : 0) }; });
    } else {
      results = members.map(function(m) { return { name: m.name, amount: m.custom || 0 }; });
    }
  }
  renderResult(total, results);
  saveHistory(total, results);
}

function renderResult(total, results) {
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('resultTotal').innerHTML = '¥' + total.toLocaleString() + ' <small>／ ' + members.length + '人</small>';
  const ul = document.getElementById('resultList');
  ul.innerHTML = '';
  results.forEach(function(r) {
    const li = document.createElement('li');
    let extra = (r.weight !== undefined && mode === 'weight') ? '<small>重み ' + r.weight + '</small>' : '';
    li.innerHTML = '<span class="name">' + escapeHtml(r.name) + '</span><span class="amount">¥' + r.amount.toLocaleString() + ' ' + extra + '</span>';
    ul.appendChild(li);
  });
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyResult() {
  const total = document.getElementById('resultTotal').textContent.trim();
  const items = Array.from(document.querySelectorAll('#resultList li')).map(function(li) {
    return li.querySelector('.name').textContent + ': ' + li.querySelector('.amount').textContent.trim();
  });
  const text = '【割り勘結果】\n合計: ' + total + '\n\n' + items.join('\n');
  navigator.clipboard.writeText(text).then(function() {
    const msg = document.getElementById('copyMsg');
    msg.classList.remove('hidden');
    setTimeout(function() { msg.classList.add('hidden'); }, 2000);
  });
}

function saveHistory(total, results) {
  const history = JSON.parse(localStorage.getItem('warikan_history') || '[]');
  history.unshift({
    total: total,
    results: results.map(function(r) { return { name: r.name, amount: r.amount }; }),
    date: new Date().toLocaleString('ja-JP')
  });
  localStorage.setItem('warikan_history', JSON.stringify(history.slice(0, 20)));
  renderHistory();
}
function renderHistory() {
  const el = document.getElementById('historyList');
  const history = JSON.parse(localStorage.getItem('warikan_history') || '[]');
  if (!history.length) { el.innerHTML = '<div class="hint">まだ履歴がありません</div>'; return; }
  el.innerHTML = history.map(function(h) {
    return '<div class="history-item"><div class="h-head"><span class="h-total">¥' + h.total.toLocaleString() + '</span><span class="h-date">' + h.date + '</span></div><div class="h-members">' + h.results.map(function(r) { return escapeHtml(r.name) + ': ¥' + r.amount.toLocaleString(); }).join(' ／ ') + '</div></div>';
  }).join('');
}
function clearHistory() {
  if (!confirm('履歴をすべて削除しますか？')) return;
  localStorage.removeItem('warikan_history');
  renderHistory();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

init();
</script>
</body>
</html>
