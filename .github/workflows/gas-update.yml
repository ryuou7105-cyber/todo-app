name: 燃料価格の自動更新

on:
  schedule:
    - cron: "0 6 * * 3,4"   # 水曜と木曜の 15:00 JST（発表は水曜なので予備の日も）
  workflow_dispatch:         # 「今すぐ実行」ボタンがManual runに付く

permissions:
  contents: write            # gas.txt を書き戻す許可

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-gas.mjs
      - name: 変わっていたら push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add text/gas.txt
          git diff --cached --quiet && echo "変更なし" || {
            git commit -m "chore: 燃料価格を自動更新"
            git push
          }
