name: Gas Price Update

on:
  schedule:
    - cron: "0 6 * * 3,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-gas.mjs
      - name: Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add text/gas.txt
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "chore: update gas prices"
            git push
          }
