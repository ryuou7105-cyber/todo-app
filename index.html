<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字化けを防ぐための設定 -->
  <meta charset="UTF-8">
  <!-- スマホで見たときに、画面の幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ブラウザのタブに表示される名前 -->
  <title>やることリスト</title>

  <style>
    /* ===== ここから見た目(デザイン)の設定 ===== */

    /* 画面全体の設定 */
    body {
      margin: 0;
      padding: 16px;
      background-color: #f2f4f8;   /* 背景の色(うすい灰色) */
      font-family: sans-serif;
      font-size: 18px;             /* 文字を少し大きめにして読みやすく */
      color: #222;
    }

    /* 中身をまとめる白い箱 */
    .container {
      max-width: 600px;            /* パソコンで広がりすぎないように */
      margin: 0 auto;              /* 真ん中に寄せる */
      background-color: #fff;
      padding: 20px;
      border-radius: 12px;         /* 角を丸くする */
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
      text-align: center;
    }

    /* 入力欄と追加ボタンを横に並べる */
    .input-area {
      display: flex;
      gap: 8px;
    }

    /* 入力欄 */
    #todo-input {
      flex: 1;                     /* 残りの幅をぜんぶ使う */
      min-width: 0;
      font-size: 18px;
      padding: 12px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    /* ボタン共通の設定(指で押しやすいように高さ48px以上) */
    button {
      min-height: 48px;
      min-width: 64px;
      font-size: 18px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }

    /* 追加ボタン(青色) */
    #add-button {
      background-color: #2f6fed;
    }

    /* 削除ボタン(赤色) */
    .delete-button {
      background-color: #e5484d;
    }

    /* リストの「・」を消して、すき間をなくす */
    #todo-list {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
    }

    /* リストの1行ぶん */
    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    /* チェックボックスを大きくして押しやすくする */
    #todo-list input[type="checkbox"] {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* やることの文字 */
    .todo-text {
      flex: 1;
      word-break: break-all;       /* 長い文字でもはみ出さないように折り返す */
    }

    /* 完了したときの見た目(打ち消し線+うすい色) */
    .done .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    /* リストが空のときのメッセージ */
    #empty-message {
      text-align: center;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- ===== ここから画面に表示される部分 ===== -->
  <div class="container">
    <h1>やることリスト</h1>

    <!-- 入力欄と追加ボタン -->
    <div class="input-area">
      <input type="text" id="todo-input" placeholder="やることを入力してね">
      <button id="add-button">追加</button>
    </div>

    <!-- やることが並ぶ場所(最初は空っぽ) -->
    <ul id="todo-list"></ul>

    <!-- リストが空のときに表示するメッセージ -->
    <p id="empty-message">やることはまだありません</p>
  </div>

  <script>
    // ===== ここから動き(プログラム)の部分 =====

    // 保存するときの名前(この名前でブラウザに保存されます)
    const STORAGE_KEY = "todo-list";

    // 画面の部品を取り出して、変数に入れておく
    const input = document.getElementById("todo-input");
    const addButton = document.getElementById("add-button");
    const list = document.getElementById("todo-list");
    const emptyMessage = document.getElementById("empty-message");

    // やることを全部しまっておく「配列」
    // 1つ1つは { text: "やること", done: 完了したかどうか } という形
    let todos = loadTodos();

    // ----- ブラウザから保存したデータを読み込む -----
    function loadTodos() {
      try {
        // localStorage(ブラウザの中の保存場所)から読み出す
        const saved = localStorage.getItem(STORAGE_KEY);
        // 保存されていれば文字から配列に戻す。なければ空の配列
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        // 何かエラーが起きたときは空の配列で始める
        return [];
      }
    }

    // ----- ブラウザにデータを保存する -----
    function saveTodos() {
      try {
        // 配列はそのまま保存できないので、文字(JSON)に変えて保存する
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch (e) {
        // 保存できない環境(プライベートモードなど)でも止まらないようにする
      }
    }

    // ----- リストを画面に表示する -----
    function render() {
      // 一度リストを空っぽにしてから、作り直す
      list.innerHTML = "";

      // todos の中身を1つずつ取り出して、画面の部品を作る
      todos.forEach(function (todo, index) {
        // 1行ぶんの入れ物 <li> を作る
        const li = document.createElement("li");
        if (todo.done) {
          li.classList.add("done"); // 完了なら打ち消し線のデザインにする
        }

        // チェックボックスを作る
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label", "完了にする");
        // チェックが変わったら、完了状態を切り替えて保存する
        checkbox.addEventListener("change", function () {
          todos[index].done = checkbox.checked;
          saveTodos();
          render();
        });

        // やることの文字を作る
        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text; // textContent を使うと安全に文字を表示できる

        // 削除ボタンを作る
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.textContent = "削除";
        // 押されたら、その1つを配列から取り除いて保存する
        deleteButton.addEventListener("click", function () {
          todos.splice(index, 1); // index番目から1つ消す
          saveTodos();
          render();
        });

        // 作った部品を <li> に入れて、リストに追加する
        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteButton);
        list.appendChild(li);
      });

      // リストが空なら「まだありません」を表示、あれば隠す
      emptyMessage.style.display = todos.length === 0 ? "block" : "none";
    }

    // ----- やることを追加する -----
    function addTodo() {
      // 入力された文字を取り出す(前後の空白は取りのぞく)
      const text = input.value.trim();

      // 何も入力されていなければ、何もしないで終わる
      if (text === "") {
        input.focus();
        return;
      }

      // 配列に新しいやることを追加する(最初は「未完了」)
      todos.push({ text: text, done: false });
      saveTodos();
      render();

      // 入力欄を空にして、続けて入力できるようにする
      input.value = "";
      input.focus();
    }

    // 「追加」ボタンが押されたら addTodo を動かす
    addButton.addEventListener("click", addTodo);

    // 入力欄で Enter キーを押したときも追加できるようにする
    input.addEventListener("keydown", function (event) {
      // isComposing は日本語の変換中かどうか。変換を決めるEnterでは追加しない
      if (event.key === "Enter" && !event.isComposing) {
        addTodo();
      }
    });

    // ページを開いたときに、保存されていたリストを表示する
    render();
  </script>
</body>
</html>
